# Static @DOMAIN@ records. Deployed to /var/unbound/etc/home.d/static.conf.
# Root-owned; never touched by dnssync. Names here are reserved in dnssync.
# The installer fills in the placeholders (D41): this box's address, and the gateway.

local-zone: "@DOMAIN@." static

local-data:     "dns.@DOMAIN@.        IN A @ADDRESS@"
local-data:     "pocketbase.@DOMAIN@. IN A @ADDRESS@"
local-data:     "router.@DOMAIN@.     IN A @GATEWAY@"

local-data-ptr: "@ADDRESS@ dns.@DOMAIN@"
local-data-ptr: "@GATEWAY@ router.@DOMAIN@"
