# Unbound: recursive, caching, DNSSEC-validating resolver for the LAN.
# Deployed to /var/unbound/etc/unbound.conf -- managed in git (HomeSubnetDns).
# The installer fills in the placeholders from site.conf and the box's LAN interface (D41).

server:
	interface: 127.0.0.1
	interface: ::1
	interface: @ADDRESS@

	access-control: 0.0.0.0/0 refuse
	access-control: ::0/0 refuse
	access-control: 127.0.0.0/8 allow
	access-control: ::1 allow
	access-control: @SUBNET@ allow

	hide-identity: yes
	hide-version: yes
	qname-minimisation: yes
	prefetch: yes
	msg-cache-size: 32m
	rrset-cache-size: 64m

	# Perform DNSSEC validation.
	auto-trust-anchor-file: "/var/unbound/db/root.key"
	val-log-level: 2

	# Synthesize NXDOMAINs from DNSSEC NSEC chains (RFC 8198).
	aggressive-nsec: yes

	# DNS-rebinding protection: public names may not resolve to private
	# addresses; only @DOMAIN@ may.
	private-address: 10.0.0.0/8
	private-address: 172.16.0.0/12
	private-address: 192.168.0.0/16
	private-address: 169.254.0.0/16
	private-address: fd00::/8
	private-address: fe80::/10
	private-domain: "@DOMAIN@"

	# Local names: static.conf (hand-maintained) and pocketbase.conf
	# (generated by dnssync).
	include: "/var/unbound/etc/home.d/*.conf"

remote-control:
	control-enable: yes
	control-interface: /var/run/unbound.sock
