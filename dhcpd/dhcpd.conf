# DHCP for the LAN. Deployed to /etc/dhcpd.conf -- managed in git (HomeSubnetDns).
# The installer fills in the placeholders from site.conf and the box's LAN interface (D41).
# The router's DHCP server is off; never run both at once.

option domain-name "@DOMAIN@";
option domain-name-servers @ADDRESS@;

subnet @NETWORK@ netmask @NETMASK@ {
	option routers @GATEWAY@;
	default-lease-time 86400;
	max-lease-time 86400;

	# The pool is the upper half of the subnet, less this box and the gateway,
	# e.g. .128-.254 on a /24. Give fixed addresses from the lower half.
	@RANGES@

	# Fixed addresses for devices with PocketBase records go here, e.g.:
	# host nas { hardware ethernet 00:11:22:33:44:55; fixed-address 192.0.2.20; }
}
